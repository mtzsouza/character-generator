<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Gerador de População de Personagens</title>
  <link rel="stylesheet" href="style.css?v=16">
</head>
<body>
  <main class="app-shell">
    <header class="page-header">
      <div>
        <h1>Gerador de População de Personagens</h1>
      </div>
    </header>

    <div class="workspace">
      <section class="panel controls-panel">
        <section class="population-controls">
          <div class="control-heading">
            <h2>Configuração da população</h2>
            <span class="control-note">1 a 1.000 personagens</span>
          </div>
          <div class="population-input-row">
            <label for="popSize">Tamanho da população
              <input id="popSize" type="number" min="1" max="1000" value="50" />
            </label>
          </div>
        </section>

        <section class="trait-controls">
          <div id="probInputs"></div>
        </section>
      </section>

      <section class="analysis-column">
        <section class="panel plot-panel">
          <div class="svg-container"><svg id="scatterPlot" viewBox="0 0 900 500" preserveAspectRatio="none"></svg></div>
          <div class="plot-toolbar">
            <div class="header-actions">
              <button id="exportBtn" class="icon-button" type="button" title="Exportar CSV" aria-label="Exportar CSV"><i data-lucide="download" aria-hidden="true"></i></button>
              <button id="importBtn" class="icon-button" type="button" title="Importar CSV" aria-label="Importar CSV"><i data-lucide="upload" aria-hidden="true"></i></button>
              <input id="importFile" class="visually-hidden" type="file" accept="text/csv" />
            </div>
            <label for="pointSizeSlider" title="Tamanho do ponto"><i data-lucide="circle-dot" aria-hidden="true"></i><span class="visually-hidden">Tamanho do ponto</span><output id="pointSizeVal">4</output>
              <input id="pointSizeSlider" type="range" min="1" max="8" step="0.5" value="4" />
            </label>
          </div>
        </section>

      </section>
    </div>

  <div class="tooltip" id="tooltip"></div>
  <div id="profileModal" class="modal-backdrop" hidden>
    <section class="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profileModalTitle">
      <div class="modal-header">
        <div>
          <p class="modal-kicker">Perfil do personagem</p>
          <h2 id="profileModalTitle">Personagem selecionado</h2>
        </div>
        <button id="closeProfileBtn" class="modal-close" type="button" aria-label="Fechar detalhes do personagem"><i data-lucide="x" aria-hidden="true"></i></button>
      </div>
      <div id="profile" class="profile">Selecione um ponto no gráfico.</div>
    </section>
  </div>

  <script src="https://unpkg.com/lucide@0.468.0"></script>
  <script src="app.js?v=8" type="module"></script>
</body>
</html>
